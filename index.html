<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyoti's Cosmetic House</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/testimonials.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Safachatt Group</div>
        <div style="position: relative;">
            <button class="menu-toggle">☰</button>
            <span class="cart-counter" id="cartCounter">0</span>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="makeover.html">Makeover</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- HEADER -->
    <header id="home">
        <h1>Jyoti's Cosmetic House</h1>
        <p>Affordable Natural Beauty</p>
    </header>

    <div class="container">

        <h2 id="products">Our Products</h2>

        <!-- CATEGORIES -->
        <div class="categories">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="SUNSCREEN">SUNSCREEN</button>
            <button class="category-btn" data-category="Body-Loation">Body Loation</button>
            <button class="category-btn" data-category="Beauty-Essentials">Beauty Essentials</button>
            <button class="category-btn" data-category="scrubs">Face & Body Scrubs</button>
            <button class="category-btn" data-category="Serums">Serum Collections</button>
        </div>

        <!-- PRODUCTS -->
        <div class="products" id="productsGrid"></div>
    </div>

    <!-- FLOATING BUTTONS -->
    <button id="goToCheckout">
        🛍️ Go to Checkout
        <span class="checkout-badge" id="checkoutBadge">0</span>
    </button>

    <button id="clearCart">🧹 Clear Cart</button>

    <script>
        /* ===== NAVBAR ===== */
        document.querySelector(".menu-toggle")
            .addEventListener("click", () =>
                document.querySelector(".nav-links").classList.toggle("show")
            );

        /* ===== CART HELPERS ===== */
        const cartCounter = document.getElementById("cartCounter");
        const checkoutBtn = document.getElementById("goToCheckout");
        const checkoutBadge = document.getElementById("checkoutBadge");
        const clearCartBtn = document.getElementById("clearCart");

        function getCart() {
            return JSON.parse(localStorage.getItem("cartData")) || [];
        }

        function saveCart(cart) {
            localStorage.setItem("cartData", JSON.stringify(cart));
        }

        function updateCartUI() {
            const cart = getCart();
            const qty = cart.reduce((s, i) => s + i.qty, 0);

            cartCounter.textContent = qty;
            checkoutBadge.textContent = qty;

            checkoutBtn.style.display = qty ? "block" : "none";
            clearCartBtn.style.display = qty ? "block" : "none";
        }

        /* ===== PRODUCTS ===== */
        const productsGrid = document.getElementById("productsGrid");
        let products = [];
        let currentCategory = "all";

        fetch("products.json")
            .then(r => r.json())
            .then(data => {
                products = data.map(p => ({
                    ...p,
                    _key: `${p.id}_${p.name}`   // unique key
                }));
                renderProducts();
                updateCartUI();
            });

        function renderProducts(category = "all") {
            currentCategory = category;
            productsGrid.innerHTML = "";

            const cart = getCart();
            const list = category === "all"
                ? products
                : products.filter(p => p.category === category);

            list.forEach(p => {
                const item = cart.find(c => c._key === p._key);
                const qty = item ? item.qty : 0;

                productsGrid.innerHTML += `
            <div class="product-card">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>
                    ₹${(p.price * (1 - p.discount / 100)).toFixed(0)}
                    <del>₹${p.price}</del>
                    <span style="color:green;">(${p.discount}% OFF)</span>
                </p>

                ${qty === 0
                        ? `<button onclick="addToCart('${p._key}')">Add to Cart</button>`
                        : `
                        <div class="qty-controls">
                            <button onclick="changeQty('${p._key}', -1)">−</button>
                            <span>${qty}</span>
                            <button onclick="changeQty('${p._key}', 1)">+</button>
                        </div>
                    `
                    }
            </div>
        `;
            });
        }

        /* ===== CATEGORY FILTER ===== */
        document.querySelectorAll(".category-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".category-btn")
                    .forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderProducts(btn.dataset.category);
            };
        });

        /* ===== CART ACTIONS ===== */
        function addToCart(key) {
            const cart = getCart();
            const product = products.find(p => p._key === key);

            const existing = cart.find(i => i._key === key);
            if (existing) existing.qty++;
            else cart.push({ ...product, qty: 1 });

            saveCart(cart);
            renderProducts(currentCategory);
            updateCartUI();
        }

        function changeQty(key, diff) {
            const cart = getCart();
            const index = cart.findIndex(i => i._key === key);
            if (index === -1) return;

            cart[index].qty += diff;
            if (cart[index].qty <= 0) cart.splice(index, 1);

            saveCart(cart);
            renderProducts(currentCategory);
            updateCartUI();
        }

        /* ===== BUTTON ACTIONS ===== */
        checkoutBtn.onclick = () => location.href = "checkout.html";

        clearCartBtn.onclick = () => {
            if (confirm("Clear all cart items?")) {
                localStorage.removeItem("cartData");
                renderProducts(currentCategory);
                updateCartUI();
            }
        };

        /* INIT */
        updateCartUI();
    </script>

</body>

</html>
