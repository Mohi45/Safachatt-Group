<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout – Safachatt Group</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/navbar.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Safachatt Group</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#products">Products</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="checkout-page">
        <div class="checkout-card">

            <h2 class="checkout-title">Checkout Summary</h2>

            <div class="checkout-layout">

                <!-- LEFT -->
                <div class="checkout-left">
                    <div class="checkout-items"></div>
                </div>

                <!-- RIGHT -->
                <div class="checkout-right">
                    <div class="sticky-payment">

                        <div class="checkout-summary">
                            <div class="summary-row">
                                <span>Total</span>
                                <span id="totalAmount">₹0</span>
                            </div>
                            <div class="saved-row">
                                🎉 You saved <span id="totalSaved">₹0</span>
                            </div>
                        </div>

                        <!-- PAYMENT METHOD -->
                        <div class="form-group">
                            <label>Payment Method</label>
                            <select id="paymentMethod">
                                <option value="UPI">UPI</option>
                                <option value="Cash on Delivery">Cash on Delivery</option>
                            </select>
                        </div>

                        <!-- UPI SECTION -->
                        <div class="upi-section" id="upiSection">
                            <strong>Pay via UPI</strong>
                            <img src="img/home/QR.jpeg" alt="UPI QR">
                            <div class="upi-id">7905729993@ybl</div>
                        </div>

                        <!-- FORM -->
                        <div class="form-group">
                            <label>Delivery Address</label>
                            <textarea id="checkoutAddress" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Name</label>
                            <input id="customerName">
                        </div>

                        <div class="form-group">
                            <label>Phone</label>
                            <input id="customerPhone">
                        </div>

                        <div class="action-bar">
                            <button class="btn-secondary" id="continueShopping">← Continue Shopping</button>
                            <button class="btn-primary" id="confirmOrder">Place Order</button>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer id="contact">
        <div class="footer-container">
            <div class="footer-item">
                <h3>Contact Us</h3>
                <p><i class="fab fa-whatsapp"></i>
                    <a href="https://wa.me/919625290733" target="_blank">+91-9625290733</a>
                </p>
                <p><i class="fas fa-envelope"></i>
                    <a href="mailto:mjsafachattgroup@gmail.com">mjsafachattgroup@gmail.com</a>
                </p>
                <p><i class="fas fa-map-marker-alt"></i>
                    C8/17 Block C, Govind Puram, Ghaziabad 201013
                </p>
            </div>
        </div>
        <div class="footer-divider"></div>
        <p class="footer-bottom">© 2025 Safachatt Group. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector(".checkout-items");
            const totalEl = document.getElementById("totalAmount");
            const savedEl = document.getElementById("totalSaved");
            const paymentSelect = document.getElementById("paymentMethod");
            const upiSection = document.getElementById("upiSection");

            // Toggle QR code
            paymentSelect.addEventListener("change", () => {
                upiSection.style.display =
                    paymentSelect.value === "Cash on Delivery" ? "none" : "block";
            });

            function renderCart() {
                const cart = JSON.parse(localStorage.getItem("cartData")) || [];
                let total = 0, saved = 0;
                container.innerHTML = "";

                if (!cart.length) {
                    container.innerHTML = "<p>No items in cart.</p>";
                    return;
                }

                cart.forEach(item => {
                    const price = Math.round(item.price * (1 - item.discount / 100));
                    const subtotal = price * item.qty;
                    const save = (item.price - price) * item.qty;

                    total += subtotal;
                    saved += save;

                    container.innerHTML += `
                        <div class="checkout-item">
                            <img src="${item.img}">
                            <div>
                                <h3>${item.name}</h3>
                                <p>Qty: ${item.qty}</p>
                                <p>₹${price} <del>₹${item.price}</del></p>
                            </div>
                            <div class="item-total">₹${subtotal}</div>
                        </div>
                    `;
                });

                totalEl.textContent = "₹" + total;
                savedEl.textContent = "₹" + saved;
            }

            renderCart();

            // PLACE ORDER VIA WHATSAPP
            document.getElementById("confirmOrder").addEventListener("click", () => {
                const name = document.getElementById("customerName").value.trim();
                const phone = document.getElementById("customerPhone").value.trim();
                const address = document.getElementById("checkoutAddress").value.trim();
                const paymentMethod = paymentSelect.value;
                const cart = JSON.parse(localStorage.getItem("cartData")) || [];

                if (!name || !phone || !address) {
                    alert("Please fill all details");
                    return;
                }

                if (!cart.length) {
                    alert("Your cart is empty");
                    return;
                }

                let message = `🛒 *New Order – Safachatt Group*\n\n`;
                message += `👤 Name: ${name}\n`;
                message += `📞 Phone: ${phone}\n`;
                message += `📍 Address: ${address}\n`;
                message += `💳 Payment Method: ${paymentMethod}\n\n`;
                message += `🧾 *Order Items:*\n`;

                let total = 0;

                cart.forEach((item, index) => {
                    const price = Math.round(item.price * (1 - item.discount / 100));
                    const subtotal = price * item.qty;
                    total += subtotal;

                    message += `${index + 1}. ${item.name}\n`;
                    message += `   Qty: ${item.qty}\n`;
                    message += `   Price: ₹${price}\n`;
                    message += `   Subtotal: ₹${subtotal}\n\n`;
                });

                message += `💰 *Total Amount: ₹${total}*\n\n`;
                message += `✅ Please confirm this order.`;

                const whatsappNumber = "9625290733"; // CHANGE IF NEEDED
                const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

                window.open(whatsappURL, "_blank");

                localStorage.removeItem("cartData");
            });

            document.getElementById("continueShopping").onclick = () => {
                window.location.href = "index.html";
            };
        });
    </script>

</body>

</html>
