<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout – Jyoti's Cosmetic House</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Safachatt Group</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#products">Products</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="checkout-page">
        <div class="checkout-card">

            <h2 class="checkout-title">Checkout Summary</h2>

            <div class="checkout-layout">

                <!-- LEFT -->
                <div class="checkout-left">
                    <div class="checkout-items"></div>
                </div>

                <!-- RIGHT -->
                <div class="checkout-right">

                    <!-- STICKY PAYMENT -->
                    <div class="sticky-payment">

                        <div class="checkout-summary">
                            <div class="summary-row">
                                <span>Total</span>
                                <span id="totalAmount">₹0</span>
                            </div>
                            <div class="saved-row">
                                🎉 You saved <span id="totalSaved">₹0</span>
                            </div>
                        </div>

                        <div class="upi-section">
                            <strong>Pay via UPI</strong>
                            <img src="img/home/QR.jpeg" alt="UPI QR">
                            <div class="upi-id">7905729993@ybl</div>
                        </div>
                        <!-- FORM -->
                        <div class="form-group">
                            <label>Delivery Address</label>
                            <textarea id="checkoutAddress" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Name</label>
                            <input id="customerName">
                        </div>

                        <div class="form-group">
                            <label>Phone</label>
                            <input id="customerPhone">
                        </div>
                        <div class="action-bar">
                            <button class="btn-secondary" id="continueShopping">← Continue Shopping</button>
                            <button class="btn-primary" id="confirmOrder">Place Order</button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <footer class="footer-bottom">
        © 2025 Safachatt Group. All Rights Reserved.
    </footer>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector(".checkout-items");
            const totalEl = document.getElementById("totalAmount");
            const savedEl = document.getElementById("totalSaved");

            function renderCart() {
                const cart = JSON.parse(localStorage.getItem("cartData")) || [];
                let total = 0, saved = 0;
                container.innerHTML = "";

                if (!cart.length) {
                    container.innerHTML = "<p>No items in cart.</p>";
                    return;
                }

                cart.forEach(item => {
                    const price = (item.price * (1 - item.discount / 100)).toFixed(0);
                    const subtotal = price * item.qty;
                    const save = (item.price - price) * item.qty;

                    total += subtotal;
                    saved += save;

                    container.innerHTML += `
                <div class="checkout-item">
                    <img src="${item.img}">
                    <div>
                        <h3>${item.name}</h3>
                        <p>Qty: ${item.qty}</p>
                        <p>₹${price} <del>₹${item.price}</del></p>
                    </div>
                    <div class="item-total">₹${subtotal}</div>
                </div>
            `;
                });

                totalEl.textContent = "₹" + total;
                savedEl.textContent = "₹" + saved;
            }

            renderCart();
        });
    </script>

</body>

</html>
